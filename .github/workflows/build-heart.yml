name: Build Heart Visuals

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Скачать исходники
        uses: actions/checkout@v4

      - name: Установить JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Установить Python и Pillow
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Установить Pillow для генерации логотипа
        run: pip install pillow

      - name: Генерация логотипа H и ребрендинг в HeartVisuals
        shell: python
        run: |
          from pathlib import Path
          import re
          from PIL import Image, ImageDraw

          ROOT = Path('.').resolve()

          # 1. Рисуем кристальный чёрно-белый логотип H с обводкой
          def make_h_logo(size=512):
              img = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              draw = ImageDraw.Draw(img)
              s = size / 512.0
              pad = int(24 * s)
              draw.rounded_rectangle(
                  [pad, pad, size - pad, size - pad],
                  radius=int(96 * s),
                  fill=(10, 10, 13, 255),
                  outline=(255, 255, 255, 200),
                  width=max(2, int(6 * s)),
              )
              w, h, gap = int(56 * s), int(260 * s), int(128 * s)
              x1 = (size - (w * 2 + gap)) // 2
              x2 = x1 + w + gap
              y1 = (size - h) // 2
              bar_h = int(48 * s)
              bar_y = (size - bar_h) // 2
              out = max(2, int(10 * s))
              for rect in [
                  [x1 - out, y1 - out, x1 + w + out, y1 + h + out],
                  [x2 - out, y1 - out, x2 + w + out, y1 + h + out],
                  [x1 - out, bar_y - out, x2 + w + out, bar_y + bar_h + out],
              ]:
                  draw.rounded_rectangle(rect, radius=int(16 * s), fill=(32, 32, 38, 255), outline=(210, 215, 225, 255), width=max(1, int(3 * s)))
              for rect in [
                  [x1, y1, x1 + w, y1 + h],
                  [x2, y1, x2 + w, y1 + h],
                  [x1, bar_y, x2 + w, bar_y + bar_h],
              ]:
                  draw.rounded_rectangle(rect, radius=int(10 * s), fill=(255, 255, 255, 255))
              return img

          # Подменяем icon.png и logo*.png в ресурсах
          for png in (ROOT / 'src/main/resources').rglob('*.png'):
              if any(k in png.name.lower() for k in ('icon', 'logo')):
                  with Image.open(png) as orig:
                      w, h = orig.size
                  logo = make_h_logo(max(w, h, 128)).resize((w, h), Image.Resampling.LANCZOS)
                  logo.save(png)
                  print("Replaced logo:", png)

          # 2. Безопасный ребрендинг в HeartVisuals
          SKIP_DIRS = {'.git', '.github', 'build', 'music'}
          TEXT_EXTS = {
              '.java', '.json', '.gradle', '.properties', '.py',
              '.vsh', '.fsh', '.glsl', '.md', '.txt', '.xml', '.toml'
          }

          def replace_safe(text: str) -> str:
              parts = re.split(r'(https://[^\s"\'<>]+|ToolVisualsMedia\.exe)', text)
              out = []
              for p in parts:
                  if p.startswith('https://') or p == 'ToolVisualsMedia.exe':
                      out.append(p)
                  else:
                      p = p.replace('ToolVisuals', 'HeartVisuals')
                      p = p.replace('toolvisuals', 'heartvisuals')
                      p = p.replace('TOOLVISUALS', 'HEARTVISUALS')
                      p = p.replace('ToolLauncher', 'HeartLauncher')
                      p = p.replace('ToolPresents', 'HeartPresents')
                      out.append(p)
              return ''.join(out)

          for path in ROOT.rglob('*'):
              if not path.is_file() or any(part in SKIP_DIRS for part in path.parts):
                  continue
              if path.suffix.lower() in TEXT_EXTS or path.name in {'NOTICE', 'LICENSE'}:
                  try:
                      old = path.read_text(encoding='utf-8')
                      new = replace_safe(old)
                      if new != old:
                          path.write_text(new, encoding='utf-8')
                  except UnicodeDecodeError:
                      pass

          paths = sorted(
              [p for p in ROOT.rglob('*') if not any(part in SKIP_DIRS for part in p.parts)],
              key=lambda p: len(p.parts),
              reverse=True,
          )
          for path in paths:
              if path.name == 'ToolVisualsMedia.exe':
                  continue
              new_name = replace_safe(path.name)
              if new_name != path.name:
                  target = path.with_name(new_name)
                  if not target.exists():
                      path.rename(target)

      - name: Загрузить зависимости (1.21.4)
        run: python build-tools/dependencies.py --target 1.21.4

      - name: Собрать JAR для Legacy Launcher (1.21.4)
        run: .\gradlew.bat :minecraft1214:build

      - name: Выгрузить готовый файл
        uses: actions/upload-artifact@v4
        with:
          name: HeartVisuals-1.21.4-Fabric
          path: build/libs/*.jar
