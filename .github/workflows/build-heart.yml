name: Build Heart Visuals

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Скачать исходники
        uses: actions/checkout@v4

      - name: Установить JDK 21 (для компиляции 1.21.4)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Установить JDK 25 (основная)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Установить Pillow
        run: pip install pillow

      - name: Логотип H, фикс Loom/Gradle и ребрендинг в Heart Visuals
        shell: python
        run: |
          from pathlib import Path
          import re
          from PIL import Image, ImageDraw

          ROOT = Path('.').resolve()

          # 1. Обновляем Fabric Loom до 1.19.3 и Gradle до 9.8.0
          for gf in [ROOT / 'build.gradle', ROOT / 'settings.gradle', ROOT / 'gradle.properties']:
              if gf.is_file():
                  txt = gf.read_text(encoding='utf-8')
                  if '1.17.21' in txt:
                      gf.write_text(txt.replace('1.17.21', '1.19.3'), encoding='utf-8')

          gw = ROOT / 'gradle/wrapper/gradle-wrapper.properties'
          if gw.is_file():
              gw.write_text(gw.read_text(encoding='utf-8').replace('9.6.1', '9.8.0'), encoding='utf-8')

          # 2. Генерация кристального чёрно-белого логотипа H с обводкой
          def make_h_logo(size=512):
              img = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              draw = ImageDraw.Draw(img)
              s = size / 512.0
              pad = int(24 * s)
              draw.rounded_rectangle(
                  [pad, pad, size - pad, size - pad],
                  radius=int(96 * s),
                  fill=(10, 10, 13, 255),
                  outline=(255, 255, 255, 200),
                  width=max(2, int(6 * s)),
              )
              w, h, gap = int(56 * s), int(260 * s), int(128 * s)
              x1 = (size - (w * 2 + gap)) // 2
              x2 = x1 + w + gap
              y1 = (size - h) // 2
              bar_h = int(48 * s)
              bar_y = (size - bar_h) // 2
              out = max(2, int(10 * s))
              for rect in [
                  [x1 - out, y1 - out, x1 + w + out, y1 + h + out],
                  [x2 - out, y1 - out, x2 + w + out, y1 + h + out],
                  [x1 - out, bar_y - out, x2 + w + out, bar_y + bar_h + out],
              ]:
                  draw.rounded_rectangle(
                      rect,
                      radius=int(16 * s),
                      fill=(32, 32, 38, 255),
                      outline=(210, 215, 225, 255),
                      width=max(1, int(3 * s)),
                  )
              for rect in [
                  [x1, y1, x1 + w, y1 + h],
                  [x2, y1, x2 + w, y1 + h],
                  [x1, bar_y, x2 + w, bar_y + bar_h],
              ]:
                  draw.rounded_rectangle(rect, radius=int(10 * s), fill=(255, 255, 255, 255))
              return img

          for png in (ROOT / 'src/main/resources').rglob('*.png'):
              if any(k in png.name.lower() for k in ('icon', 'logo')):
                  with Image.open(png) as orig:
                      w, h = orig.size
                  make_h_logo(max(w, h, 128)).resize((w, h), Image.Resampling.LANCZOS).save(png)
                  print("Replaced logo:", png)

          # 3. Меняем имя итогового JAR в gradle.properties
          gp = ROOT / 'gradle.properties'
          if gp.is_file():
              text = gp.read_text(encoding='utf-8')
              text = re.sub(r'(?m)^archives_base_name=.*$', 'archives_base_name=HeartVisuals', text)
              gp.write_text(text, encoding='utf-8')

          # 4. Меняем отображаемое название в ресурсах (lang, fabric.mod.json)
          for res_root in [ROOT / 'src/main/resources', ROOT / 'versions']:
              if not res_root.exists():
                  continue
              for path in res_root.rglob('*.json'):
                  if path.name == 'fabric.mod.json' or 'lang' in path.parts:
                      old = path.read_text(encoding='utf-8')
                      new = old.replace('ToolVisuals', 'Heart Visuals').replace('Tool Visuals', 'Heart Visuals')
                      if new != old:
                          path.write_text(new, encoding='utf-8')

          # 5. Меняем видимые надписи в кавычках внутри src/
          def replace_in_quotes(match):
              s = match.group(0)
              if 'https://' in s or 'ToolVisualsMedia.exe' in s:
                  return s
              return s.replace('ToolVisuals', 'Heart Visuals').replace('Tool Visuals', 'Heart Visuals')

          for java_file in (ROOT / 'src/main/java').rglob('*.java'):
              old = java_file.read_text(encoding='utf-8')
              new = re.sub(r'"[^"\n]*"', replace_in_quotes, old)
              if new != old:
                  java_file.write_text(new, encoding='utf-8')

      - name: Загрузить зависимости
        run: python build-tools/dependencies.py

      - name: Собрать JAR для Legacy Launcher (1.21.4)
        run: .\gradlew.bat :minecraft1214:build "-Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64"

      - name: Выгрузить готовый файл
        uses: actions/upload-artifact@v4
        with:
          name: HeartVisuals-1.21.4-Fabric
          path: build/libs/*.jar
